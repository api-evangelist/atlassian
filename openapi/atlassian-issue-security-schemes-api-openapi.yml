          readOnly: true
          type: string
        id:
          description: The ID of the issue security scheme.
          format: int64
          readOnly: true
          type: integer
        name:
          description: The name of the issue security scheme.
          readOnly: true
          type: string
        projectIds:
          description: The list of project IDs associated with the issue security scheme.
          items:
            format: int64
            readOnly: true
            type: integer
          readOnly: true
          type: array
          uniqueItems: true
        self:
          description: The URL of the issue security scheme.
          readOnly: true
          type: string
      required:
      - id
      - name
      - self
      type: object
