openapi: 3.2.0
info:
  title: Atlassian The Confluence Cloud REST Content States API
  description: This document describes the REST API and resources provided by Confluence.
  termsOfService: https://atlassian.com/terms/
  version: 1.0.0
servers:
- url: //your-domain.atlassian.net
tags:
- name: Content States
paths:
  /wiki/rest/api/content/{id}/state:
    get:
      tags:
      - Content States
      summary: Atlassian Get Content State
      description: 'Gets the current content state of the draft or current version of content. To specify the draft version, set

        the parameter status to draft, otherwise archived or current will get the relevant published state.

        **Permissions required**:

        Permission to view the content.'
      operationId: atlassianGetcontentstate
      parameters:
      - name: id
        in: path
        description: The id of the content whose content state is of interest.
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: Set status to one of [current,draft,archived]. Default value is current.
        schema:
          type: string
          default: current
          enum:
          - current
          - draft
          - archived
      responses:
        '200':
          description: Returned if permission allows viewing of content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStateResponse'
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have content view permission.
        '404':
          description: Returned if the content with given id can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:confluence-content.summary
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:confluence-content.summary
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:content-details:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
    put:
      tags:
      - Content States
      summary: Atlassian Set The Content State Of A Content And Publishes A New Version Of The…
      description: 'Sets the content state of the content specified and creates a new version

        (publishes the content without changing the body) of the content with the new state.


        You may pass in either an id of a state, or the name and color of a desired new state.

        If all 3 are passed in, id will be used.

        If the name and color passed in already exist under the current user''s existing custom states, the existing state will be reused.

        If custom states are disabled in the space of the content (which can be determined by getting the content state space settings of the content''s space)

        then this set will fail.


        You may not remove a content state via this PUT request. You must use the DELETE method. A specified state is required in the body of this request.


        **Permissions required**:

        Permission to edit the content.'
      operationId: atlassianSetcontentstate
      requestBody:
        description: Content state fields for state. Pass in id for an existing state, or new name and color for best matching existing state, or new state if allowed in space.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentStateRestInput'
        required: true
      parameters:
      - name: id
        in: path
        description: The Id of the content whose content state is to be set.
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: 'Status of content onto which state will be placed. If draft, then draft state will change.

          If current, state will be placed onto a new version of the content with same body as previous version.'
        schema:
          type: string
          enum:
          - current
          - draft
      responses:
        '200':
          description: Returned if content state is set successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStateResponse'
        '400':
          description: 'Invalid Name/Color, non-existent id of content state, or type of state desired is not allowed.

            Name must be less than or exactly 20 characters. Color must be a valid hex string.

            Status must be in [draft,current].'
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have content edit permission.
        '404':
          description: Returned if the content with given id can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-content
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - write:content:confluence
        - read:content-details:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: WRITE
    delete:
      tags:
      - Content States
      summary: Atlassian Removes The Content State Of A Content And Publishes A New Version
      description: 'Removes the content state of the content specified and creates a new version

        (publishes the content without changing the body) of the content with the new status.


        **Permissions required**:

        Permission to edit the content.'
      operationId: atlassianRemovecontentstate
      parameters:
      - name: id
        in: path
        description: The Id of the content whose content state is to be set.
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: status of content state from which to delete state. Can be draft or archived
        schema:
          type: string
          enum:
          - current
          - draft
      responses:
        '200':
          description: Returned if content state is removed from content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStateResponse'
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have content edit permission.
        '404':
          description: Returned if the content with given id can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-content
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - write:content:confluence
        - read:content-details:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: WRITE
  /wiki/rest/api/content/{id}/state/available:
    get:
      tags:
      - Content States
      summary: Atlassian Gets Available Content States For Content
      description: 'Gets content states that are available for the content to be set as.

        Will return all enabled Space Content States.

        Will only return most the 3 most recently published custom content states to match UI editor list.

        To get all custom content states, use the /content-states endpoint.


        **Permissions required**:

        Permission to edit the content.'
      operationId: atlassianGetavailablecontentstates
      parameters:
      - name: id
        in: path
        description: id of content to get available states for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returned if the content is found and permission is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableContentStates'
        '400':
          description: Invalid status for content. Must be in [current,draft,archived].
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have content edit permission.
        '404':
          description: Returned if the content with given id can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-content
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - write:content:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
  /wiki/rest/api/content-states:
    put:
      tags:
      - Content States
      summary: Atlassian Bulk Set Content State Of Many Contents
      deprecated: true
      description: 'Creates a long running task that sets content state of draft or published versions of pages specified.


        **Permissions required**

        Content Edit Permission for a content to have its state set via this endpoint.'
      operationId: atlassianBulksetcontentstates
      parameters:
      - name: status
        in: query
        required: true
        description: Set status to one of [current,draft].
        schema:
          type: string
          enum:
          - current
          - draft
      requestBody:
        description: The content state and ids to set it to.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkContentStateSetInput'
        required: true
      responses:
        '200':
          description: 'Returned if a task to set content states is created. Returns the taskId.

            This task id can be passed into /wiki/rest/api/content-states/task/{taskId} for a result'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncId'
        '400':
          description: Returned if too many contents, no contents, no content state, or no status are passed in.
        '404':
          description: Returned if content cannot be found with the provided context.
      security:
      - oAuthDefinitions:
        - write:confluence-content
      - basicAuth: []
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - write:content:confluence
        - read:content-details:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: WRITE
    get:
      tags:
      - Content States
      summary: Atlassian Get Custom Content States
      description: 'Get custom content states that authenticated user has created.


        **Permissions required**

        Must have user authentication.'
      operationId: atlassianGetcustomcontentstates
      responses:
        '200':
          description: Custom Content States that user has crated. Returned if user authenticated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentState'
        '401':
          description: Returned if user is not authenticated.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:user.property:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:user.property:confluence
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:user.property:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
  /wiki/rest/api/content-states/delete:
    post:
      tags:
      - Content States
      summary: Atlassian Bulk Remove Content States From Content
      description: 'Creates a long running task that Removes content state from draft or published versions of pages specified.


        **Permissions required**

        Content Edit Permission for a content to have its state removed via this endpoint.'
      operationId: atlassianBulkremovecontentstates
      parameters:
      - name: status
        in: query
        required: true
        description: Set status to one of [current,draft].
        schema:
          type: string
          enum:
          - current
          - draft
      requestBody:
        content:
          application/json:
            schema:
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContentId'
      responses:
        '200':
          description: 'Returned if a task to remove content states is created. Returns the taskId.

            This task id can be passed into /wiki/rest/api/content-states/task/{taskId}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncId'
        '400':
          description: Returned if too many contents, no contents, no content state, or no status are passed in.
        '401':
          description: Returned if user not authenticated.
        '403':
          description: Returned if user not found or does not have permission for content stat
        '404':
          description: Returned if content cannot be found with the provided context.
      security:
      - oAuthDefinitions:
        - write:confluence-content
      - basicAuth: []
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - write:content:confluence
        - read:content-details:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: WRITE
  /wiki/rest/api/content-states/task/{taskId}:
    get:
      tags:
      - Content States
      summary: Atlassian Get Update On Long Running Task For Setting Of Content State
      description: 'Get Status of long running task that was previously created to set or remove content states from content.

        User must first create a task by passing in details to /wiki/rest/api/content-states PUT or DELETE endpoints.


        **Permissions required**

        Must have created long running task'
      operationId: atlassianGettaskupdate
      parameters:
      - name: taskId
        in: path
        schema:
          type: string
        description: taskId returned by put or delete requests to /wiki/rest/api/content-states
        required: true
      responses:
        '200':
          description: Task found. State of task is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStateBulkSetTaskUpdate'
        '403':
          description: User not authenticated.
        '404':
          description: No long running task by calling user with given taskId found.
      security:
      - oAuthDefinitions:
        - read:confluence-content
      - basicAuth: []
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:confluence-content
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:content:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
  /wiki/rest/api/space/{spaceKey}/state:
    get:
      tags:
      - Content States
      summary: Atlassian Get Space Suggested Content States
      description: 'Get content states that are suggested in the space.

        **Permissions required**:

        Space view permission'
      operationId: atlassianGetspacecontentstates
      parameters:
      - name: spaceKey
        in: path
        description: The key of the space to be queried for its content state settings.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returned if the requested space exists, and user has space view permission.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentState'
                description: Space suggested content states that users can choose from
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have space admin permission.
        '404':
          description: Returned if the space with given key can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:confluence-space.summary
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:confluence-space.summary
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:space.setting:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
  /wiki/rest/api/space/{spaceKey}/state/settings:
    get:
      tags:
      - Content States
      summary: Atlassian Get Content State Settings For Space
      description: 'Get object describing whether content states are allowed at all, if custom content states or space content states

        are restricted, and a list of space content states allowed for the space if they are not restricted.


        **Permissions required**:

        Space admin permission'
      operationId: atlassianGetcontentstatesettings
      parameters:
      - name: spaceKey
        in: path
        description: The key of the space to be queried for its content state settings.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returned if the requested space exists, and user has space admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStateSettings'
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have space admin permission.
        '404':
          description: Returned if the space with given key can not be found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:confluence-space.summary
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:confluence-space.summary
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:space.setting:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
  /wiki/rest/api/space/{spaceKey}/state/content:
    get:
      tags:
      - Content States
      summary: Atlassian Get Content In Space With Given Content State
      description: 'Finds paginated content with


        **Permissions required**:

        Space View Permission'
      operationId: atlassianGetcontentswithstate
      parameters:
      - name: spaceKey
        in: path
        description: The key of the space to be queried for its content state settings.
        required: true
        schema:
          type: string
      - name: state-id
        in: query
        description: The id of the content state to filter content by
        required: true
        schema:
          type: integer
          format: int32
      - name: expand
        in: query
        description: 'A multi-value parameter indicating which properties of the content to expand.

          Options include: space, version, history, children, etc.


          Ex: space,version'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
          format: int32
          default: 25
      - name: start
        in: query
        description: Number of result to start returning. (0 indexed)
        schema:
          type: integer
          minimum: 0
          format: int32
      responses:
        '200':
          description: Returned if search was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArray'
        '400':
          description: Returned if limit or start are out of range, stateId is omitted.
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if user does not have space view permission.
        '404':
          description: Returned if the space with given key can not be found.
      security:
      - oAuthDefinitions:
        - read:confluence-content.all
      - basicAuth: []
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:confluence-content.all
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:content:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
components:
  schemas:
    ContentStateInput:
      type: object
      properties:
        name:
          type: string
        color:
          description: "Color of state. Must be in 6 digit hex form (#FFFFFF). The default colors offered in the UI are:\n #ff7452 (red),\n #2684ff (blue),\n #ffc400 (yellow),\n #57d9a3 (green), and\n #8777d9 (purple)"
          type: string
        id:
          type: integer
          format: int32
        spaceKey:
          type: string
    Content:
      required:
      - status
      - type
      type:
      - object
      - 'null'
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          description: Can be "page", "blogpost", "attachment" or "content"
        status:
          type: string
        title:
          type: string
        space:
          $ref: '#/components/schemas/Space'
        history:
          $ref: '#/components/schemas/ContentHistory'
        version:
          $ref: '#/components/schemas/Version'
        ancestors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Content'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationCheckResult'
        children:
          $ref: '#/components/schemas/ContentChildren'
        childTypes:
          $ref: '#/components/schemas/ContentChildType'
        descendants:
          $ref: '#/components/schemas/ContentChildren'
        container:
          $ref: '#/components/schemas/Container'
        body:
          type: object
          properties:
            view:
              $ref: '#/components/schemas/ContentBody'
            export_view:
              $ref: '#/components/schemas/ContentBody'
            styled_view:
              $ref: '#/components/schemas/ContentBody'
            storage:
              $ref: '#/components/schemas/ContentBody'
            wiki:
              $ref: '#/components/schemas/ContentBody'
            editor:
              $ref: '#/components/schemas/ContentBody'
            editor2:
              $ref: '#/components/schemas/ContentBody'
            anonymous_export_view:
              $ref: '#/components/schemas/ContentBody'
            atlas_doc_format:
              $ref: '#/components/schemas/ContentBody'
            dynamic:
              $ref: '#/components/schemas/ContentBody'
            raw:
              $ref: '#/components/schemas/ContentBody'
            _expandable:
              type: object
              properties:
                editor:
                  type: string
                view:
                  type: string
                export_view:
                  type: string
                styled_view:
                  type: string
                storage:
                  type: string
                editor2:
                  type: string
                anonymous_export_view:
                  type: string
                atlas_doc_format:
                  type: string
                wiki:
                  type: string
                dynamic:
                  type: string
                raw:
                  type: string
        restrictions:
          type: object
          properties:
            read:
              $ref: '#/components/schemas/ContentRestriction'
            update:
              $ref: '#/components/schemas/ContentRestriction'
            _expandable:
              type: object
              properties:
                read:
                  type: string
                update:
                  type: string
            _links:
              $ref: '#/components/schemas/GenericLinks'
        metadata:
          $ref: '#/components/schemas/ContentMetadata'
        macroRenderedOutput:
          type: object
          additionalProperties:
            type: object
        extensions:
          type: object
        _expandable:
          type: object
          properties:
            childTypes:
              type: string
            container:
              type: string
            metadata:
              type: string
            operations:
              type: string
            children:
              type: string
            restrictions:
              type: string
            history:
              type: string
            ancestors:
              type: string
            body:
              type: string
            version:
              type: string
            descendants:
              type: string
            space:
              type: string
            extensions:
              type: string
            schedulePublishDate:
              type: string
            schedulePublishInfo:
              type: string
            macroRenderedOutput:
              type: string
        _links:
          $ref: '#/components/schemas/GenericLinks'
      description: Base object for all content types.
    ContentStateResponse:
      type: object
      properties:
        contentState:
          $ref: '#/components/schemas/ContentState'
          description: Null or content state
        lastUpdated:
          type: string
          description: Timestamp of last publish event where content state changed
    Label:
      required:
      - id
      - label
      - name
      - prefix
      type: object
      properties:
        prefix:
          type: string
        name:
          type: string
        id:
          type: string
        label:
          type: string
    ContentStateFailure:
      required:
      - contentId
      - failureReason
      type: object
      properties:
        contentId:
          $ref: '#/components/schemas/ContentId'
        failureReason:
          type: string
      description: Object describing why a content state set failed
    SpaceSettings:
      required:
      - _links
      - routeOverrideEnabled
      type:
      - object
      - 'null'
      properties:
        routeOverrideEnabled:
          type: boolean
          description: 'Defines whether an override for the space home should be used. This is

            used in conjunction with a space theme provided by an app. For

            example, if this property is set to true, a theme can display a page

            other than the space homepage when users visit the root URL for a

            space. This property allows apps to provide content-only theming

            without overriding the space home.'
        editor:
          required:
          - page
          - blogpost
          - default
          type: object
          properties:
            page:
              type: string
            blogpost:
              type: string
            default:
              type: string
        spaceKey:
          type: string
        _links:
          $ref: '#/components/schemas/GenericLinks'
    Icon:
      required:
      - height
      - isDefault
      - path
      - width
      type:
      - object
      - 'null'
      properties:
        path:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        isDefault:
          type: boolean
      description: This object represents an icon. If used as a profilePicture, this may be returned as null, depending on the user's privacy setting.
    NavigationLookAndFeel:
      required:
      - color
      - hoverOrFocus
      type:
      - object
      - 'null'
      properties:
        color:
          type: string
        highlightColor:
          type:
          - string
          - 'null'
        hoverOrFocus:
          required:
          - backgroundColor
