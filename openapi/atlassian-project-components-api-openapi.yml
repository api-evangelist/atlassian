      description: 'Returns the counts of issues assigned to the component.<br><br>This operation can be accessed anonymously.<br><br>**Deprecation notice:** The required OAuth 2.0 scopes will be updated on June 15, 2024.<br><br> *  **Classic**: `read:jira-work`<br> *  **Granular**: `read:field:jira`, `read:project.component:jira`<br><br>**[Permissions](#permissions) required:** None.'
      operationId: atlassianGetcomponentrelatedissues
      parameters:
