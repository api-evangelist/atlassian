  /rest/api/3/project/{projectIdOrKey}/component:
    get:
      deprecated: false
      description: Returns a [paginated](#pagination) list of all components in a project. See the [Get project components](#api-rest-api-3-project-projectIdOrKey-components-get) resource if you want to get a full list of versions without pagination.<br><br>If your project uses Compass components, this API will return a list of Compass components that are linked to issues in that project.<br><br>This operation can be accessed anonymously.<br><br>**[Permissions](#permissions) required:** *Browse Projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project.
      operationId: atlassianGetprojectcomponentspaginated
      parameters:
      - description: The project ID or project key (case sensitive).
        in: path
        name: projectIdOrKey
        required: true
        schema:
          type: string
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: 0
          format: int64
          type: integer
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: 50
          format: int32
          type: integer
      - description: "[Order](#ordering) the results by a field:\n\n *  `description` Sorts by the component description.\n *  `issueCount` Sorts by the count of issues associated with the component.\n *  `lead` Sorts by the user key of the component's project lead.\n *  `name` Sorts by component name."
        in: query
        name: orderBy
        schema:
          enum:
          - description
          - -description
          - +description
          - issueCount
          - -issueCount
          - +issueCount
          - lead
          - -lead
          - +lead
          - name
          - -name
          - +name
          type: string
      - description: The source of the components to return. Can be `jira` (default), `compass` or `auto`. When `auto` is specified, the API will return connected Compass components if the project is opted into Compass, otherwise it will return Jira components. Defaults to `jira`.
        in: query
        name: componentSource
        schema:
          default: jira
          enum:
          - jira
          - compass
          - auto
          type: string
      - description: Filter the results using a literal string. Components with a matching `name` or `description` are returned (case insensitive).
        in: query
        name: query
        schema:
          type: string
      responses:
        '200':
