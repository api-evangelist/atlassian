                        type: text
                      type: paragraph
                    type: doc
                    version: 1
                  customfield_50000:
                    content:
                    - content:
                      - text: Could impact day-to-day work.
                        type: text
                      type: paragraph
                    type: doc
                    version: 1
                  customfield_60000: jira-software-users
                  customfield_70000:
                  - jira-administrators
                  - jira-software-users
                  customfield_80000:
                    value: red
                  description:
                    content:
                    - content:
                      - text: Order entry fails when selecting supplier.
                        type: text
                      type: paragraph
                    type: doc
                    version: 1
                  duedate: '2011-03-11'
                  environment:
                    content:
                    - content:
                      - text: UAT
