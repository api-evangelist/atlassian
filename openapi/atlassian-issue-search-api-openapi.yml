    post:
      deprecated: false
      description: Searches for issues using [JQL](https://confluence.atlassian.com/x/egORLQ).<br><br>There is a [GET](#api-rest-api-3-search-get) version of this resource that can be used for smaller JQL query expressions.<br><br>This operation can be accessed anonymously.<br><br>**[Permissions](#permissions) required:** Issues are included in the response where the user has:<br><br> *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project containing the issue.<br> *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
      operationId: atlassianSearchforissuesusingjqlpost
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              expand:
              - names
              - schema
              - operations
              fields:
              - summary
              - status
              - assignee
              fieldsByKeys: false
              jql: project = HSP
              maxResults: 15
              startAt: 0
            schema:
              $ref: '#/components/schemas/SearchRequestBean'
        description: A JSON object containing the search request.
        required: true
