  /rest/api/3/notificationscheme/{id}/notification:
    put:
      deprecated: false
      description: 'Adds notifications to a notification scheme. You can add up to 1000 notifications per request.


        *Deprecated: The notification type `EmailAddress` is no longer supported in Cloud. Refer to the changelog for more details.*


        **Permissions required:** *Administer Jira* global permission.'
      operationId: atlassianAddnotifications
      parameters:
      - description: The ID of the notification scheme.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              notificationSchemeEvents:
              - event:
                  id: '1'
                notifications:
                - notificationType: Group
                  parameter: jira-administrators
            schema:
              $ref: '#/components/schemas/AddNotificationsDetails'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["Event type with ID 2 not found."],"errors":{}}'
