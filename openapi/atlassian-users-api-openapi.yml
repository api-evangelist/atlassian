components:
  schemas:
    UserPage:
      type: object
      description: A paginated list of users.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The list of users.
          example: []
        links:
          $ref: '#/components/schemas/PaginationLinks'
    InviteUsersRequest:
      type: object
      description: Request body for inviting users to the organization.
      properties:
        emails:
          type: array
          description: Email addresses of users to invite.
          items:
            type: string
            format: email
          example: user@example.com
        directoryId:
          type: string
          description: The directory to add the invited users to.
          example: '500123'
        groupIds:
          type: array
          description: Groups to assign the invited users to.
          items:
            type: string
          example: []
        roleAssignments:
          type: array
          description: Application roles to assign to the invited users.
          items:
            type: object
            properties:
              role:
                type: string
              resource:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
          example: []
    PaginationLinks:
      type: object
      description: Links for cursor-based pagination.
      properties:
        self:
          type: string
          format: uri
          description: Link to the current page.
          example: https://www.example.com
        next:
          type: string
          format: uri
          description: Link to the next page of results.
          example: https://www.example.com
        prev:
          type: string
          format: uri
          description: Link to the previous page of results.
          example: https://www.example.com
    RoleAssignment:
      type: object
      description: Represents a role assignment for a user.
      properties:
        role:
          type: string
          description: The role identifier.
          example: example_value
        resource:
          type: object
          description: The resource the role is assigned to.
          properties:
            id:
              type: string
              description: The resource identifier.
            type:
              type: string
              description: The resource type.
          example: example_value
    InviteUsersResponse:
      type: object
      description: Response for user invitation requests.
      properties:
        data:
          type: object
          properties:
            invited:
              type: array
              description: Users that were successfully invited.
              items:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                  accountId:
                    type: string
            failed:
              type: array
              description: Users that failed to be invited.
              items:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                  reason:
                    type: string
          example: example_value
    RoleAssignmentRequest:
      type: object
      description: Request body for assigning or revoking product roles.
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                description: The role to assign or revoke.
              resource:
                type: object
                properties:
                  id:
                    type: string
                    description: The resource identifier.
                  type:
                    type: string
                    description: The resource type.
          example: []
    ErrorResponse:
      type: object
      description: Standard error response.
      properties:
        code:
          type: integer
          description: The HTTP status code.
          example: 10
        message:
          type: string
          description: A human-readable error message.
          example: example_value
        errors:
          type: array
          description: Detailed error information.
          items:
            type: object
            properties:
              code:
                type: string
                description: A machine-readable error code.
              message:
                type: string
                description: A human-readable description of the error.
          example: []
    User:
      type: object
      description: Represents a user account in an Atlassian organization.
      properties:
        account_id:
          type: string
          description: The unique Atlassian account identifier.
          example: '500123'
        account_type:
          type: string
          description: The type of account.
          enum:
          - atlassian
          - customer
          - app
          example: atlassian
        account_status:
          type: string
          description: The current status of the account.
          enum:
          - active
          - inactive
          - closed
          example: active
        name:
          type: string
          description: The display name of the user.
          example: Example Title
        email:
          type: string
          format: email
          description: The email address of the user.
          example: user@example.com
        picture:
          type: string
          format: uri
          description: URL of the user's profile picture.
          example: https://www.example.com
        nickname:
          type: string
          description: The nickname of the user.
          example: example_value
        last_active:
          type: string
          format: date-time
          description: The last time the user was active.
          example: '2026-01-15T10:30:00Z'
        created:
          type: string
          format: date-time
          description: When the user account was created.
          example: '2026-01-15T10:30:00Z'
        product_access:
          type: array
          description: Products the user has access to.
          items:
            type: object
            properties:
              key:
                type: string
                description: The product key.
              name:
                type: string
                description: The product name.
              url:
                type: string
                format: uri
                description: The URL of the product site.
              last_active:
                type: string
                format: date-time
                description: Last time the user accessed this product.
          example: []
    OrgRoleAssignmentRequest:
      type: object
      description: Request body for assigning or revoking organization-level roles.
      properties:
        role:
          type: string
          description: The organization-level role to assign or revoke. Common roles include org-admin, trusted-user, and user.
          enum:
          - org-admin
          - trusted-user
          - user
          example: org-admin
    error:
      type: object
      title: Error
      description: Base type for most resource objects. It defines the common `type` element that identifies an object's type. It also identifies the element as Swagger's `discriminator`.
      properties:
        type:
          type: string
        error:
          type: object
          properties:
            message:
              type: string
            detail:
              type: string
            data:
              type: object
              description: Optional structured data that is endpoint-specific.
              properties: {}
              additionalProperties: true
          required:
          - message
          additionalProperties: false
      required:
      - type
      additionalProperties: true
    account_links:
      type: object
      title: Account Links
      description: Links related to an Account.
      properties:
        avatar:
          $ref: '#/components/schemas/link'
      additionalProperties: true
    link:
      type: object
      title: Link
      description: A link to a resource related to this object.
      properties:
        href:
          type: string
          format: uri
        name:
          type: string
      additionalProperties: false
    object:
      type: object
      description: Base type for most resource objects. It defines the common `type` element that identifies an object's type. It also identifies the element as Swagger's `discriminator`.
      properties:
        type:
          type: string
      required:
      - type
      additionalProperties: true
      discriminator:
        propertyName: type
    account:
      allOf:
      - $ref: '#/components/schemas/object'
      - type: object
        title: Account
        description: An account object.
        properties:
          links:
            $ref: '#/components/schemas/account_links'
          created_on:
            type: string
            format: date-time
          display_name:
            type: string
          username:
            type: string
            pattern: ^[a-zA-Z0-9_\-]+$
          uuid:
            type: string
        additionalProperties: true
    ContentLookAndFeel:
      type: object
      properties:
        screen:
