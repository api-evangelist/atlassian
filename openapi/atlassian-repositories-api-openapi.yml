  /repositories/{workspace}/{repo_slug}/filehistory/{commit}/{path}:
    parameters:
    - name: commit
      in: path
      description: The commit's SHA1.
      required: true
      schema:
        type: string
    - name: path
      in: path
      description: Path to the file.
      required: true
      schema:
        type: string
    - name: repo_slug
      in: path
      description: 'This can either be the repository slug or the UUID of the repository,

        surrounded by curly-braces, for example: `{repository UUID}`.

        '
      required: true
      schema:
        type: string
    - name: workspace
      in: path
      description: 'This can either be the workspace ID (slug) or the workspace UUID

        surrounded by curly-braces, for example: `{workspace UUID}`.

        '
      required: true
      schema:
        type: string
    get:
      tags:
      - Repositories
      description: 'Returns a paginated list of commits that modified the specified file.


        Commits are returned in reverse chronological order. This is roughly

        equivalent to the following commands:


        $ git log --follow --date-order


        By default, Bitbucket will follow renames and the path name in the

        returned entries reflects that. This can be turned off using the

        `?renames=false` query parameter.


        Results are returned in descending chronological order by default, and

        like most endpoints you can

        filter and sort the response to

        only provide exactly the data you want.


        The example response returns commits made before 2011-05-18 against a file

        named `README.rst`. The results are filtered to only return the path and

        date. This request can be made using:


        ```

        $ curl ''https://api.bitbucket.org/2.0/repositories/evzijst/dogslow/filehistory/master/README.rst''\

        ''?fields=values.next,values.path,values.commit.date&q=commit.date<=2011-05-18''

        ```


        In the response you can see that the file was renamed to `README.rst`

        by the commit made on 2011-05-16, and was previously named `README.txt`.'
      summary: List commits that modified a file
      responses:
        '200':
          description: A paginated list of commits that modified the specified file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginated_files'
              example:
                values:
                - commit:
                    date: '2011-05-17T07:32:09+00:00'
                  path: README.rst
                - commit:
                    date: '2011-05-16T06:33:28+00:00'
                  path: README.txt
                - commit:
                    date: '2011-05-16T06:15:39+00:00'
                  path: README.txt
        '404':
          description: If the repository does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      parameters:
      - name: renames
        in: query
        description: '

          When `true`, Bitbucket will follow the history of the file across

          renames (this is the default behavior). This can be turned off by

          specifying `false`.'
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: '

          Query string to narrow down the response as per

          [filtering and sorting](/cloud/bitbucket/rest/intro/#filtering).'
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: '

          Name of a response property sort the result by as per

          [filtering and sorting](/cloud/bitbucket/rest/intro/#sorting-query-results).

          '
        required: false
        schema:
          type: string
      security:
      - oauth2:
        - repository
      - basic: []
      - api_key: []
      x-atlassian-oauth2-scopes:
      - state: Current
        scheme: oauth2
        scopes:
        - read:repository:bitbucket
      x-atlassian-auth-types:
      - forge-oauth2
      - api-token
      operationId: getRepositoriesByWorkspaceByRepoSlugFilehistoryByCommitByPath
      x-operation-id-source: derived
    servers:
    - url: https://api.bitbucket.org/2.0
  /repositories/{workspace}/{repo_slug}/hooks:
    get:
      operationId: list_repository_hooks
      summary: List webhooks for a repository
      description: Returns a paginated list of webhooks installed on this repository.
      tags:
      - Repositories
      parameters:
      - name: workspace
        description: This can either be the workspace ID (slug) or the workspace UUID surrounded by curly-braces, for example `{workspace UUID}`.
        required: true
        in: path
        schema:
          type: string
      - name: repo_slug
        description: 'This can either be the repository slug or the UUID of the repository, surrounded by curly-braces, for example: `{repository UUID}`.'
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: The paginated list of installed webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginated_webhook_subscriptions'
        '403':
          description: If the authenticated user is not an owner on the specified repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: If the webhook or repository does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - oauth2:
        - webhook
      - basic: []
      - api_key: []
      x-atlassian-oauth2-scopes:
      - state: Current
        scheme: oauth2
        scopes:
        - read:webhook:bitbucket
      x-atlassian-auth-types:
      - api-token
    post:
      operationId: create_repository_hook
      summary: Create a webhook for a repository
      description: 'Creates a new webhook on the specified repository.


        Workspace webhooks are fired for events from all repositories

        contained by that workspace.


        Example:

        ```

        $ curl -X POST -u credentials -H ''Content-Type: application/json''

        https://api.bitbucket.org/2.0/workspaces/my-workspace/hooks

        -d ''

        {

        "description": "Webhook Description",

        "url": "https://example.com/",

        "active": true,

        "secret": "this is a really bad secret",

        "events": [

        "repo:push",

        "issue:created",

        "issue:updated"

        ]

        }''

        ```


        When the `secret` is provided it will be used as the key to

        generate a HMAC digest value sent in the `X-Hub-Signature` header

        at delivery time. Passing a `null` or empty `secret` or not

        passing a `secret` will leave the webhook''s secret unset.

        Bitbucket only generates the `X-Hub-Signature` when the webhook''s

        secret is set.


        This call requires the webhook scope, as well as any scope

        that applies to the events that the webhook subscribes to. In the

        example above that means: `webhook`, `repository` and `issue`.


        The `url` must properly resolve and cannot be an internal,

        non-routed address.'
      tags:
      - Repositories
      parameters:
      - name: workspace
        description: This can either be the workspace ID (slug) or the workspace UUID surrounded by curly-braces, for example `{workspace UUID}`.
        required: true
        in: path
        schema:
          type: string
      - name: repo_slug
        description: 'This can either be the repository slug or the UUID of the repository, surrounded by curly-braces, for example: `{repository UUID}`.'
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: If the webhook was registered successfully.
          headers:
            Location:
              description: The URL of new newly created webhook.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhook_subscription'
        '403':
          description: If the authenticated user does not have permission to install webhooks on the specified repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: If the webhook or repository does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - oauth2:
        - webhook
      - basic: []
      - api_key: []
      x-atlassian-oauth2-scopes:
      - state: Current
        scheme: oauth2
        scopes:
        - read:webhook:bitbucket
        - write:webhook:bitbucket
      x-atlassian-auth-types:
      - api-token
    servers:
    - url: https://api.bitbucket.org/2.0
  /repositories/{workspace}/{repo_slug}/hooks/{uid}:
    get:
      operationId: get_repository_hook
      summary: Get a webhook for a repository
      description: 'Returns the webhook with the specified id installed on the

        specified repository.'
      tags:
      - Repositories
      parameters:
      - name: workspace
        description: This can either be the workspace ID (slug) or the workspace UUID surrounded by curly-braces, for example `{workspace UUID}`.
        required: true
