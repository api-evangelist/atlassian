- name: Status
paths:
  /rest/api/3/statuses:
    delete:
      deprecated: false
      description: Deletes statuses by ID.<br><br>**[Permissions](#permissions) required:**<br><br> *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)<br> *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: atlassianDeletestatusesbyid
      parameters:
      - description: 'The list of status IDs. To include multiple IDs, provide an ampersand-separated list. For example, id=10000&id=10001.


          Min items `1`, Max items `50`'
        in: query
        name: id
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Atlassian Bulk Delete Statuses
      tags:
      - Status
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:workflow:jira
        state: Beta
      x-atlassian-connect-scope: ADMIN
    get:
      deprecated: false
      description: Returns a list of the statuses specified by one or more status IDs.<br><br>**[Permissions](#permissions) required:**<br><br> *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)<br> *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: atlassianGetstatusesbyid
      parameters:
      - description: "Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expand options include:\n\n *  `usages` Returns the project and issue types that use the status in their workflow.\n *  `workflowUsages` Returns the workflows that use the status."
        in: query
        name: expand
        schema:
          type: string
      - description: 'The list of status IDs. To include multiple IDs, provide an ampersand-separated list. For example, id=10000&id=10001.


          Min items `1`, Max items `50`'
        in: query
        name: id
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE","usages":[{"issueTypes":["10002"],"project":{"id":"1"}}],"workflowUsages":[{"workflowId":"545d80a3-91ff-4949-8b0d-a2bc484e70e5","workflowName":"Workflow 1"}]}]'
              schema:
                items:
                  $ref: '#/components/schemas/JiraStatus'
                type: array
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Atlassian Bulk Get Statuses
      tags:
      - Status
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:workflow:jira
        state: Beta
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: Creates statuses for a global or project scope.<br><br>**[Permissions](#permissions) required:**<br><br> *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)<br> *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: atlassianCreatestatuses
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              scope:
                project:
                  id: '1'
                type: PROJECT
              statuses:
              - description: The issue is resolved
                name: Finished
                statusCategory: DONE
            schema:
              $ref: '#/components/schemas/StatusCreateRequest'
        description: Details of the statuses being created and their scope.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE","usages":[],"workflowUsages":[]}]'
              schema:
                items:
                  $ref: '#/components/schemas/JiraStatus'
                type: array
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '409':
          description: Returned if another workflow configuration update task is ongoing.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Atlassian Bulk Create Statuses
      tags:
      - Status
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:workflow:jira
        state: Beta
      x-atlassian-connect-scope: ADMIN
    put:
      deprecated: false
      description: Updates statuses by ID.<br><br>**[Permissions](#permissions) required:**<br><br> *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)<br> *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: atlassianUpdatestatuses
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              statuses:
              - description: The issue is resolved
                id: '1000'
                name: Finished
                statusCategory: DONE
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
        description: The list of statuses that will be updated.
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '409':
          description: Returned if another workflow configuration update task is ongoing.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Atlassian Bulk Update Statuses
      tags:
      - Status
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:workflow:jira
        state: Beta
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/statuses/search:
    get:
      deprecated: false
      description: Returns a [paginated](https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/#pagination) list of statuses that match a search on name or project.<br><br>**[Permissions](#permissions) required:**<br><br> *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)<br> *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: atlassianSearch
      parameters:
      - description: "Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expand options include:\n\n *  `usages` Returns the project and issue types that use the status in their workflow.\n *  `workflowUsages` Returns the workflows that use the status."
        in: query
        name: expand
        schema:
          type: string
      - description: The project the status is part of or null for global statuses.
        in: query
        name: projectId
        schema:
          type: string
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: 0
          format: int64
          type: integer
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: 200
          format: int32
          type: integer
      - description: Term to match status names against or null to search for all statuses in the search scope.
        in: query
        name: searchString
        schema:
          maxLength: 255
          type: string
      - description: 'Category of the status to filter by. The supported values are: `TODO`, `IN_PROGRESS`, and `DONE`.'
        in: query
        name: statusCategory
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":2,"nextPage":"https://your-domain.atlassian.net/rest/api/3/statuses/search?startAt=2&maxResults=2","self":"https://your-domain.atlassian.net/rest/api/3/statuses/search?startAt=0&maxResults=2","startAt":0,"total":5,"values":[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE","usages":[{"issueTypes":["10002"],"project":{"id":"1"}}],"workflowUsages":[{"workflowId":"545d80a3-91ff-4949-8b0d-a2bc484e70e5","workflowName":"Workflow 1"}]}]}'
              schema:
                $ref: '#/components/schemas/PageOfStatuses'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Atlassian Search Statuses Paginated
      tags:
      - Status
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:workflow:jira
        state: Beta
      x-atlassian-connect-scope: READ
components:
  schemas:
    PageOfStatuses:
      additionalProperties: false
      properties:
        isLast:
          description: Whether this is the last page.
          type: boolean
        maxResults:
          description: The maximum number of items that could be returned.
          format: int32
          type: integer
        nextPage:
          description: The URL of the next page of results, if any.
          type: string
        self:
          description: The URL of this page.
          type: string
        startAt:
          description: The index of the first item returned on the page.
          format: int64
          type: integer
        total:
          description: Number of items that satisfy the search.
          format: int64
          type: integer
        values:
          description: The list of items.
          items:
            $ref: '#/components/schemas/JiraStatus'
          type: array
      type: object
    StatusUpdateRequest:
      additionalProperties: false
      description: The list of statuses that will be updated.
      properties:
        statuses:
          description: The list of statuses that will be updated.
          items:
            $ref: '#/components/schemas/StatusUpdate'
          type: array
      required:
      - statuses
      type: object
    StatusUpdate:
      additionalProperties: true
      description: Details of the status being updated.
      properties:
        description:
          description: The description of the status.
          type: string
        id:
          description: The ID of the status.
          type: string
        name:
          description: The name of the status.
          type: string
        statusCategory:
          description: The category of the status.
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          type: string
      required:
      - id
      - name
      - statusCategory
      type: object
    ProjectIssueTypes:
      additionalProperties: false
      description: Use the optional `workflows.usages` expand to get additional information about the projects and issue types associated with the requested workflows.
      properties:
        issueTypes:
          description: IDs of the issue types
          items:
            description: IDs of the issue types
            type:
            - string
            - 'null'
          type:
          - array
          - 'null'
          uniqueItems: true
        project:
          $ref: '#/components/schemas/ProjectId'
      type: object
    ProjectId:
      additionalProperties: false
      description: Project ID details.
      properties:
        id:
          description: The ID of the project.
          type: string
      required:
      - id
      type:
      - object
      - 'null'
    WorkflowUsages:
      additionalProperties: false
      description: The workflows that use this status. Only available if the `workflowUsages` expand is requested.
      properties:
        workflowId:
          description: Workflow ID.
          type: string
        workflowName:
          description: Workflow name.
          type: string
      type: object
    StatusCreate:
      additionalProperties: false
      description: Details of the status being created.
      properties:
        description:
          description: The description of the status.
          type: string
        name:
          description: The name of the status.
          maxLength: 255
          type: string
        statusCategory:
          description: The category of the status.
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          type: string
      required:
      - name
      - statusCategory
      type: object
    JiraStatus:
      additionalProperties: false
      description: Details of a status.
      properties:
        description:
          description: The description of the status.
          type: string
        id:
          description: The ID of the status.
          type: string
        name:
          description: The name of the status.
          type: string
        scope:
          $ref: '#/components/schemas/StatusScope'
        statusCategory:
          description: The category of the status.
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          type: string
        usages:
          description: Projects and issue types where the status is used. Only available if the `usages` expand is requested.
          items:
            $ref: '#/components/schemas/ProjectIssueTypes'
          type: array
          uniqueItems: true
        workflowUsages:
          description: The workflows that use this status. Only available if the `workflowUsages` expand is requested.
          items:
            $ref: '#/components/schemas/WorkflowUsages'
          type: array
          uniqueItems: true
      type: object
    StatusCreateRequest:
      additionalProperties: false
      description: Details of the statuses being created and their scope.
      properties:
        scope:
          $ref: '#/components/schemas/StatusScope'
        statuses:
          description: Details of the statuses being created.
          items:
            $ref: '#/components/schemas/StatusCreate'
          type: array
      required:
      - scope
      - statuses
      type: object
    StatusScope:
      additionalProperties: false
      description: The scope of the status.
      properties:
        project:
          $ref: '#/components/schemas/ProjectId'
        type:
          description: The scope of the status. `GLOBAL` for company-managed projects and `PROJECT` for team-managed projects.
          enum:
          - PROJECT
          - GLOBAL
          type: string
      required:
      - type
      type: object
